version: "2"
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - prealloc
  settings:
    gocritic:
      disabled-checks:
        - commentedOutCode
      enabled-tags:
        - performance
        - diagnostic
    gosec:
      excludes:
        - G104
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
